<title>系統維護中｜DocuSky 數位人文學術研究平台</title>

<style>
  :root {
    --bg: #eaf2f9; --bg-deep: #d6e6f3; --panel: #ffffff; --brand-band: #ffffff;
    --ink: #1f2a44; --muted: #55607a; --navy: #1b3a8c; --sky: #4aa3df;
    --line: #c3d6e8; --node: #ffffff; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a2c; --bg-deep: #0a1322; --panel: #16233a; --brand-band: #f4f8fc;
      --ink: #e6edf7; --muted: #a3b1c8; --navy: #8fb2ff; --sky: #5fb4ec;
      --line: #22344f; --node: #3a5274; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a2c; --bg-deep: #0a1322; --panel: #16233a; --brand-band: #f4f8fc;
    --ink: #e6edf7; --muted: #a3b1c8; --navy: #8fb2ff; --sky: #5fb4ec;
    --line: #22344f; --node: #3a5274; color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; }
  body {
    min-height: 100%;
    background: radial-gradient(ellipse at 50% 30%, var(--bg) 0%, var(--bg-deep) 100%);
    background-color: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.8;
    display: grid; place-items: center;
    padding: 1.5rem;
    overflow-x: hidden;
  }
  .network { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .network line { stroke: var(--line); stroke-width: 1; }
  .network circle { fill: var(--node); stroke: var(--line); stroke-width: 1; }

  main {
    position: relative; z-index: 1;
    width: 100%; max-width: 42rem;
    background: var(--panel);
    border-radius: 6px;
    border-top: 5px solid var(--sky);
    box-shadow: 0 20px 50px -24px rgba(27, 58, 140, .35);
    overflow: hidden;
  }
  .brand {
    background: var(--brand-band);
    padding: clamp(1.5rem, 5vw, 2.25rem) clamp(1.5rem, 6vw, 3.5rem) clamp(1.25rem, 4vw, 1.75rem);
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  .brand img { display: block; height: auto; width: min(100%, 210px); }
  .brand img.wide { width: min(100%, 440px); margin-left: -1.2rem; }
  .tagline { color: #1b3a8c; font-weight: 500; font-size: 1.05rem; line-height: 1.4; }

  .body { padding: clamp(1.75rem, 5vw, 2.5rem) clamp(1.5rem, 6vw, 3.5rem) clamp(2rem, 6vw, 3rem); }
  .status {
    display: inline-flex; align-items: center; gap: .5rem;
    font-size: .9rem; color: var(--muted); margin-bottom: .75rem;
  }
  .status::before {
    content: ""; width: .6rem; height: .6rem; border-radius: 50%;
    background: #e8a33d; box-shadow: 0 0 0 4px rgba(232, 163, 61, .2);
  }
  h1 { font-size: clamp(1.6rem, 4.6vw, 2.25rem); font-weight: 700; line-height: 1.35; margin-bottom: 1rem; }
  p { font-size: 1.05rem; max-width: 36em; }
  :lang(ko) h1, :lang(ko) p { word-break: keep-all; }
  p + p { margin-top: .75rem; }

  .contact {
    margin-top: 2rem; padding-top: 1.5rem;
    border-top: 1px dashed var(--line);
    font-size: .95rem; color: var(--muted);
  }
  a { color: var(--navy); }
  .contact a { font-weight: 500; text-underline-offset: 3px; word-break: break-all; }
  a:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; border-radius: 2px; }

  .bottom {
    margin-top: 1.75rem;
    display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
    font-size: .82rem; color: var(--muted);
  }
  .langs { display: flex; gap: .25rem; }
  .langs a {
    text-decoration: none; padding: .2rem .6rem; border-radius: 4px;
    border: 1px solid transparent;
  }
  .langs a:hover { border-color: var(--line); }
  .langs a[aria-current="page"] { color: var(--ink); border-color: var(--line); font-weight: 500; }
</style>
</head>
